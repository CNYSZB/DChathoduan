const toastEl = document.getElementById('toast'); let toastTimer = null;

function showToast(message, type = 'info', duration = 2000) {
  if (toastTimer) { clearTimeout(toastTimer); toastEl.classList.remove('show', 'error', 'success'); }
  toastEl.textContent = message;
  toastEl.className = 'toast';
  if (type === 'error') toastEl.classList.add('error');
  if (type === 'success') toastEl.classList.add('success');
  requestAnimationFrame(() => { requestAnimationFrame(() => { toastEl.classList.add('show'); }); });
  toastTimer = setTimeout(() => { toastEl.classList.remove('show'); toastTimer = null; }, duration);
}

let confirmResolve = null;

function showConfirm(title, message, okText = '删除') {
  return new Promise((resolve) => {
    confirmResolve = resolve;
    document.getElementById('confirmTitle').textContent = title;
    document.getElementById('confirmMsg').textContent = message;
    document.getElementById('confirmOkBtn').textContent = okText;
    document.getElementById('confirmModal').classList.add('show');
  });
}

function hideConfirm(result) {
  document.getElementById('confirmModal').classList.remove('show');
  if (confirmResolve) { confirmResolve(result); confirmResolve = null; }
}

document.getElementById('confirmOkBtn').onclick = () => hideConfirm(true);
document.getElementById('confirmCancelBtn').onclick = () => hideConfirm(false);
document.getElementById('confirmModal').onclick = (e) => { if (e.target === document.getElementById('confirmModal')) hideConfirm(false); };

function toggleInlineSelect(btn, optionsContainer) {
  const isOpen = optionsContainer.classList.contains('show');
  document.querySelectorAll('.inline-select-options.show').forEach(el => el.classList.remove('show'));
  if (!isOpen) { optionsContainer.classList.add('show'); }
}

function setupInlineSelect(btnSelector, optionsSelector) {
  const btn = document.querySelector(btnSelector);
  const optionsContainer = document.querySelector(optionsSelector);
  if (!btn || !optionsContainer) return;
  btn.addEventListener('click', (e) => { e.stopPropagation(); toggleInlineSelect(btn, optionsContainer); });
  optionsContainer.querySelectorAll('.inline-select-option').forEach(opt => {
    opt.addEventListener('click', (e) => {
      e.stopPropagation();
      btn.textContent = opt.textContent;
      btn.dataset.value = opt.dataset.value;
      optionsContainer.classList.remove('show');
      if (btnSelector === '#aiTypeSelectBtn' || btnSelector === '#editAiTypeSelectBtn') {
        const isTool = opt.dataset.value === 'tool';
        if (btnSelector === '#aiTypeSelectBtn') {
          document.getElementById('agentGenderBox').classList.toggle('hide', isTool);
        } else {
          document.getElementById('editAgentGenderBox').classList.toggle('hide', isTool);
        }
      }
    });
  });
}

document.addEventListener('click', (e) => {

});

const promptModal = document.getElementById('promptModal'),
      promptTitle = document.getElementById('promptTitle'),
      promptInput = document.getElementById('promptInput');
let promptResolve = null;

function showPrompt(title, placeholder = '') {
  return new Promise((resolve) => {
    promptTitle.textContent = title;
    promptInput.placeholder = placeholder || '';
    promptInput.value = '';
    promptResolve = resolve;
    promptModal.classList.add('show');
    promptInput.focus();
  });
}

function closePrompt(value) {
  promptModal.classList.remove('show');
  if (promptResolve) { promptResolve(value); promptResolve = null; }
}
document.getElementById('promptConfirm').onclick = () => closePrompt(promptInput.value.trim());
document.getElementById('promptCancel').onclick = () => closePrompt(null);
promptInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); closePrompt(promptInput.value.trim()); } });
promptModal.onclick = (e) => { if (e.target === promptModal) closePrompt(null); };

function patchConfig() {
  const defaults = {
    apiLine: 'default',
    customApi: '',
    customModel: '',
    fontSize: 16,
    specialMode: false,
    lightMode: false,
    homeBackground: null,
    enterToSend: true,

// ===== [FIX] 补全 agents 缺失字段 =====
function patchAgents() {
  if (!Array.isArray(agents)) return;
  agents.forEach(agent => {
    if (!agent.avatar || agent.avatar === 'dx.png' || agent.avatar === 'tx.png') {
      agent.avatar = defaultAvatarData || 'tx.png';
    }
    if (agent.chatBackground === undefined) agent.chatBackground = null;
    if (agent.pinned === undefined) agent.pinned = false;
    if (!agent.aiConfig) {
      agent.aiConfig = { type: 'emotion', gender: 'neutral', style: DEFAULT_STYLE.emotion, temperature: DEFAULT_TEMPERATURE.emotion };
    } else {
      if (!agent.aiConfig.style) agent.aiConfig.style = DEFAULT_STYLE[agent.aiConfig.type] || DEFAULT_STYLE.emotion;
      if (agent.aiConfig.temperature === undefined) {
        agent.aiConfig.temperature = agent.aiConfig.type === 'tool' ? DEFAULT_TEMPERATURE.tool : DEFAULT_TEMPERATURE.emotion;
      }
    }
    if (!Array.isArray(agent.chats)) agent.chats = [];
    agent.chats.forEach(chat => {
      if (chat.pinned === undefined) chat.pinned = false;
      if (!Array.isArray(chat.messages)) chat.messages = [];
    });
    if (agent.chats.length === 0) {
      agent.chats.push({ id: 'chat_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6), title: '新对话', messages: [], pinned: false });

  });
  saveAgents();
}

const AGREEMENT_URL = 'https://cnyszb.github.io/xy/xy.html';
const AGREEMENT_STORAGE_KEY = 'dchat_agreement_version';
let latestCloudVersion = '0', currentAgreementVersion = '0';

function getStoredAgreementVersion() { return localStorage.getItem(AGREEMENT_STORAGE_KEY) || '0'; }
function setStoredAgreementVersion(version) { localStorage.setItem(AGREEMENT_STORAGE_KEY, version); }

function openAgreement(force) {
  const overlay = document.getElementById('agreementOverlay'), iframe = document.getElementById('agreementIframe');
  overlay.classList.remove('hidden'); iframe.src = AGREEMENT_URL + '?t=' + Date.now();
  iframe.onload = function() { iframe.contentWindow.postMessage({ type: 'setAgreementMode', force: force }, '*'); };
}

function closeAgreement() { document.getElementById('agreementOverlay').classList.add('hidden'); document.getElementById('agreementIframe').src = ''; }

window.addEventListener('message', function(e) {
  if (!e.data || !e.data.type) return;
  if (e.data.type === 'agreementAccepted') {
    if (e.data.version) { setStoredAgreementVersion(e.data.version); currentAgreementVersion = e.data.version; }
    closeAgreement(); showToast('欢迎使用 Dchat', 'success');
  } else if (e.data.type === 'agreementRejected') {
    setStoredAgreementVersion('0'); closeAgreement();
    document.body.innerHTML = '<div style="position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:99999999;display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:system-ui;"><div style="font-size:18px;color:#e0e0e0;margin-bottom:8px;">您不同意协议</div><div style="font-size:14px;color:#888;">请退出软件</div></div>';
  } else if (e.data.type === 'agreementClosed') closeAgreement();
});

function startAgreementCheck() { checkAgreementVersion(); setInterval(() => checkAgreementVersion(), 600000); }

function checkAgreementVersion() {
  fetch(AGREEMENT_URL + '?t=' + Date.now()).then(r => r.text()).then(html => {
    const m = html.match(/const AGREEMENT_VERSION = '(\d+)'/);
    if (m && m[1]) { latestCloudVersion = m[1]; if (getStoredAgreementVersion() !== latestCloudVersion) openAgreement(true); }
  }).catch(() => {});
}

let agents = [], currentAgentId = null, currentChatId = null, defaultAvatarData = null;

function loadDefaultAvatar() {
  return new Promise(resolve => {
    const img = new Image(); img.crossOrigin = 'anonymous';
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
      c.getContext('2d').drawImage(img, 0, 0);
      defaultAvatarData = c.toDataURL('image/png');
      resolve(defaultAvatarData);
    };
    img.onerror = () => { defaultAvatarData = 'tx.png'; resolve(defaultAvatarData); };
    img.src = 'tx.png';
  });
}

async function migrateOldData() {
  await loadDefaultAvatar();

  const oldChats = JSON.parse(localStorage.getItem("chats"));
  if (oldChats && !localStorage.getItem("agents")) {
    agents = oldChats.map((chat, index) => ({
      id: 'agent_' + Date.now() + index,
      name: chat.title + '（旧版）',
      avatar: defaultAvatarData,
      description: '从旧版对话迁移',
      aiConfig: chat.aiConfig || { type: 'emotion', gender: 'neutral', style: DEFAULT_STYLE.emotion, temperature: DEFAULT_TEMPERATURE.emotion },
      chats: [{ id: 'chat_' + Date.now() + index, title: chat.title, messages: chat.messages || [], pinned: chat.pinned || false }],
      pinned: false,
      createdAt: Date.now(),
      chatBackground: null
    }));
    saveAgents();
    localStorage.removeItem("chats");
  } else {
    agents = JSON.parse(localStorage.getItem("agents")) || [];
  }

  // [FIX] 补全 agents 缺失字段
  patchAgents();

  // 确保至少一个智能体
  if (agents.length === 0) {
    agents.push({
      id: 'agent_default',
      name: '情感陪伴助手',
      avatar: defaultAvatarData,
      description: '一个善解人意的聊天伙伴',
      aiConfig: { type: 'emotion', gender: 'neutral', style: DEFAULT_STYLE.emotion, temperature: DEFAULT_TEMPERATURE.emotion },
      chats: [{ id: 'chat_default', title: '新对话', messages: [], pinned: false }],
      pinned: false,
      createdAt: Date.now(),
      chatBackground: null
    });
    saveAgents();
  }

  // [FIX] 补全 config 缺失字段
  patchConfig();
}

function processBracketContent(text) {
  const escaped = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  return escaped.replace(/（([^）]*)）/g, '<span class="bracket-content">（$1）</span>');
}

function renderMessageContent(content) {
  const codeBlockRegex = /```(\w+)\s*\n([\s\S]*?)```/g;
  const parts = [];
  let lastIndex = 0, match;
  while ((match = codeBlockRegex.exec(content)) !== null) {
    if (match.index > lastIndex) {
      parts.push({ type: 'text', content: processBracketContent(content.substring(lastIndex, match.index)) });
    }
    const lang = match[1];
    const code = match[2].replace(/\n$/, '');
    parts.push({ type: 'code', lang: lang, code: code });
    lastIndex = match.index + match[0].length;
  }
  if (lastIndex < content.length) {
    parts.push({ type: 'text', content: processBracketContent(content.substring(lastIndex)) });
  }
  if (parts.length === 0) return processBracketContent(content);

  let html = '';
  parts.forEach(part => {
    if (part.type === 'text') {
      html += part.content;
    } else if (part.type === 'code') {
      const escapedCode = part.code.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      const codeId = 'code_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
      html += '<div class="code-block-wrap"><div class="code-block-header"><span class="code-lang-tag">' + part.lang + '</span><button class="code-copy-btn" data-code-id="' + codeId + '">复制</button></div><div class="code-block-body"><pre><code id="' + codeId + '">' + escapedCode + '</code></pre></div></div>';
    }
  });
  return html;
}

function renderAgentList() {
  const list = document.getElementById('agentList');
  const sorted = [...agents].sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));
  list.innerHTML = '';
  sorted.forEach(agent => {
    const card = document.createElement('div');
    card.className = 'agent-card ' + (agent.pinned ? 'pinned' : '') + ' ' + (selectedAgentIds.has(agent.id) ? 'selected' : '');
    card.dataset.id = agent.id;

    const checkbox = document.createElement('div');
    checkbox.className = 'agent-checkbox ' + (selectedAgentIds.has(agent.id) ? 'checked' : '');
    checkbox.onclick = (e) => { e.stopPropagation(); selectedAgentIds.has(agent.id) ? selectedAgentIds.delete(agent.id) : selectedAgentIds.add(agent.id); renderAgentList(); updateDeleteBar(); };
    card.appendChild(checkbox);

    const avatar = document.createElement('img');
    avatar.className = 'agent-avatar'; avatar.src = agent.avatar || defaultAvatarData;
    avatar.onerror = () => avatar.src = defaultAvatarData;
    card.appendChild(avatar);

    const info = document.createElement('div');
    info.className = 'agent-info';
    info.innerHTML = '<div class="agent-name">' + agent.name + '</div><div class="agent-desc">' + (agent.description || '') + '</div>';
    card.appendChild(info);

    const actions = document.createElement('div');
    actions.className = 'agent-actions';
    actions.innerHTML = '<span class="pin-agent">📌</span><span class="edit-agent">✏️</span><span class="delete-agent">✕</span>';
    card.appendChild(actions);

    card.addEventListener('click', (e) => {
      if (e.target.closest('.agent-actions') || e.target.closest('.agent-checkbox')) return;
      if (multiSelectMode) { selectedAgentIds.has(agent.id) ? selectedAgentIds.delete(agent.id) : selectedAgentIds.add(agent.id); renderAgentList(); updateDeleteBar(); }
      else enterChat(agent.id);
    });

    actions.querySelector('.pin-agent').addEventListener('click', (e) => {
      e.stopPropagation();
      const pc = agents.filter(a => a.pinned).length;
      if (!agent.pinned && pc >= 3) { showToast('最多只能置顶3个智能体', 'error'); return; }
      agent.pinned = !agent.pinned; saveAgents(); renderAgentList();
    });

    actions.querySelector('.edit-agent').addEventListener('click', (e) => { e.stopPropagation(); openEditAgentModal(agent); });

    actions.querySelector('.delete-agent').addEventListener('click', async (e) => {
      e.stopPropagation();
      if (agents.length <= 1) { showToast('至少保留一个智能体', 'error'); return; }
      const confirmed = await showConfirm('确认删除', '确定删除智能体"' + agent.name + '"吗？此操作不可恢复。', '删除');
      if (confirmed) { agents = agents.filter(a => a.id !== agent.id); saveAgents(); renderAgentList(); }
    });

    list.appendChild(card);
  });
  document.body.classList.toggle('multi-select-mode', multiSelectMode);
}

function readImageFile(file) {
  return new Promise((resolve, reject) => {
    if (!file) { reject(new Error('No file')); return; }
    const reader = new FileReader();
    reader.onload = (ev) => resolve(ev.target.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function checkText(text) {
  if (config.specialMode) return true;
  const key = getEffectiveApiKey(); if (!key) return true;
  try {
    const res = await fetch(DEEPSEEK_CONFIG.apiUrl, { method: "POST", headers: { "Content-Type": "application/json", "Authorization": "Bearer " + key }, body: JSON.stringify({ model: "Qwen/Qwen2.5-7B-Instruct", messages: [{ role: "user", content: "你是极度宽松的内容审核员。判断原则：1.只有直接、露骨、详细的色情动作描写才算异常 2.只有明确的暴力威胁才算异常 3.只有具体的违法犯罪操作指导才算异常。回复只回复'正常'或'异常'两个字。\n" + text }], temperature: 0.1, max_tokens: 8 }) });
    return ((await res.json()).choices?.[0]?.message?.content || "").trim() === "正常";
  } catch (e) { return true; }
}

function renderChatList() {
  const agent = getCurrentAgent();
  const list = document.getElementById("chatList"); list.innerHTML = "";
  [...agent.chats].sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0)).forEach(chat => {
    const item = document.createElement("div");
    item.className = 'chat-item ' + (chat.pinned ? 'pinned' : '') + ' ' + (chat.id === currentChatId ? 'active' : '');
    let ah = '<span class="rename" data-id="' + chat.id + '">✏️</span>';
    ah += '<span class="del" data-id="' + chat.id + '">✕</span>';
    item.innerHTML = '<div class="chat-item-left"><span class="pin-icon ' + (chat.pinned ? 'pinned' : '') + '" data-id="' + chat.id + '">📌</span><span class="chat-title-text">' + chat.title + '</span></div><div class="chat-item-actions">' + ah + '</div>';

    item.querySelector('.pin-icon').onclick = (e) => { e.stopPropagation(); chat.pinned = !chat.pinned; saveAgents(); renderChatList(); };
    item.addEventListener("click", (e) => {
      if (e.target.closest('.del') || e.target.closest('.rename') || e.target.closest('.pin-icon')) return;
      currentChatId = chat.id; renderChatList(); renderMessages(); applyChatBackground();
      document.getElementById("chatTitle").innerText = chat.title; closeSidebar();
    });
    item.querySelector(".rename").onclick = async (e) => {
      e.stopPropagation();
      document.getElementById('renameInput').value = chat.title; showModal(document.getElementById('renameModal'));
      const cf = () => { const nt = document.getElementById('renameInput').value.trim(); if (nt) { chat.title = nt; saveAgents(); renderChatList(); document.getElementById("chatTitle").innerText = chat.title; } hideModal(document.getElementById('renameModal')); };
      document.getElementById('renameConfirm').onclick = cf;
      document.getElementById('renameCancel').onclick = () => hideModal(document.getElementById('renameModal'));
    };
    item.querySelector(".del").onclick = async (e) => {
      e.stopPropagation();
      if (agent.chats.length <= 1) { showToast("至少保留一个对话", "error"); return; }
      const confirmed = await showConfirm('确认删除', '确定删除此对话吗？此操作不可恢复。', '删除');
      if (confirmed) {
        agent.chats = agent.chats.filter(c => c.id !== chat.id); currentChatId = agent.chats[0].id;
        saveAgents(); renderChatList(); renderMessages(); applyChatBackground();
        document.getElementById("chatTitle").innerText = agent.chats[0].title;
      }
    };
    list.appendChild(item);
  });
}

function renderMessages() {
  const chat = getCurrentChat(); const box = document.getElementById("messages"); box.innerHTML = "";
  if (!chat) return;
  chat.messages.forEach(msg => {
    const div = document.createElement("div");
    div.className = 'msg ' + (msg.role === "assistant" ? "ai" : "user");
    div.innerHTML = renderMessageContent(msg.content);
    box.appendChild(div);
  });
  box.querySelectorAll('.code-copy-btn').forEach(btn => {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      const codeId = this.dataset.codeId;
      const codeEl = document.getElementById(codeId);
      if (codeEl) {
        navigator.clipboard.writeText(codeEl.textContent).then(() => { showToast('代码已复制', 'success', 1500); }).catch(() => { showToast('代码已复制', 'success', 1500); });
      }
    });
  });
  box.scrollTop = box.scrollHeight;
}

function insertHelpButtons() {
  const modalBody = document.querySelector('#modal .modal-body');

  const apiLabel = modalBody.querySelector('.api-select-wrap label');

    btn.onclick = (e) => { e.stopPropagation(); e.preventDefault(); showHelpTooltip('api_source'); };

  const fontSetting = modalBody.querySelector('.font-size-setting:first-of-type');
  if (fontSetting) {
    const fontLabel = fontSetting.querySelector('span:first-child');
    if (fontLabel && !fontLabel.querySelector('.help-btn')) {

      btn.onclick = (e) => { e.stopPropagation(); e.preventDefault(); showHelpTooltip('font_size'); };

  }

  const allSettings = modalBody.querySelectorAll('.font-size-setting');
  allSettings.forEach(setting => {
    const firstSpan = setting.querySelector('span:first-child');
    if (firstSpan && firstSpan.textContent.includes('token') && !firstSpan.querySelector('.help-btn')) {
      const btn = document.createElement('span'); btn.className = 'help-btn'; btn.textContent = '?';
      btn.onclick = (e) => { e.stopPropagation(); e.preventDefault(); showHelpTooltip('max_tokens'); };
      firstSpan.appendChild(btn);
    }
  });

  const switchBoxes = modalBody.querySelectorAll('.switch-box');
  const switchKeys = ['light_mode', 'creator_mode', 'enter_to_send'];
  switchBoxes.forEach((box, index) => {
    if (index < switchKeys.length) {
      const span = box.querySelector('span:first-child');
      if (span && !span.querySelector('.help-btn')) {
        const btn = document.createElement('span'); btn.className = 'help-btn'; btn.textContent = '?';
        btn.onclick = (e) => { e.stopPropagation(); e.preventDefault(); showHelpTooltip(switchKeys[index]); };

  const bgLabel = modalBody.querySelector('label[style*="margin-top:16px"]');
  if (bgLabel && bgLabel.textContent.includes('背景') && !bgLabel.querySelector('.help-btn')) {
    const btn = document.createElement('span'); btn.className = 'help-btn'; btn.textContent = '?';

  const input = document.getElementById('input');
  const start = input.selectionStart, end = input.selectionEnd, text = input.value;
  const before = text.substring(0, start), selected = text.substring(start, end), after = text.substring(end);
  if (selected) {
    input.value = before + '（' + selected + '）' + after;
    input.selectionStart = start + 1 + selected.length + 1;
    input.selectionEnd = start + 1 + selected.length + 1;
  } else {
    input.value = before + '（）' + after;
    input.selectionStart = start + 1;
    input.selectionEnd = start + 1;
  }
  input.focus();
});

let lastGeneratedImageUrl = null;
let activeStreamAbort = null;
let thinkingTimer = null;
let hasReceivedContent = false;

function addEllipsisToContent(content) {
  if (!content) return '…';
  const trimmed = content.trimEnd();
  if (!trimmed) return '…';
  const lastChar = trimmed.slice(-1);
  if (/[。.！!？?，,；;：:、…～~—\-]/.test(lastChar)) return trimmed.slice(0, -1) + '…';
  return trimmed + '…';
}

function startThinkingTimer(loadingEl, baseText) {
  thinkingTimer = setInterval(() => {
    if (hasReceivedContent) { clearInterval(thinkingTimer); thinkingTimer = null; return; }
    if (loadingEl && loadingEl.parentNode) {
      let c = parseInt(loadingEl.dataset.thinkDotCount) || 0;
      c = (c + 1) % 4;
      loadingEl.dataset.thinkDotCount = c;
      loadingEl.textContent = baseText + '.'.repeat(c);
    }
  }, 500);
}

function stopThinkingTimer() { if (thinkingTimer) { clearInterval(thinkingTimer); thinkingTimer = null; } }

async function sendMsg() {
  if (activeStreamAbort) {
    activeStreamAbort.abort();
    activeStreamAbort = null;
    stopThinkingTimer();
    const chat = getCurrentChat();
    if (chat && chat.messages.length > 0) {
      const lastMsg = chat.messages[chat.messages.length - 1];
      if (lastMsg.role === 'assistant' && lastMsg._streaming) {
        lastMsg.content = addEllipsisToContent(lastMsg.content);
        delete lastMsg._streaming;
        saveAgents();
        renderMessages();
      }
    }
    const loadingEl = document.querySelector("#messages .loading");
    if (loadingEl) loadingEl.remove();
  }

  const text = document.getElementById("input").value.trim();
  if (!text) return;
  if (config.apiLine === 'custom' && !config.customModel) { showToast('使用自定义API时，请先选择模型', 'error'); return; }

  const agentId = currentAgentId, chatId = currentChatId,
        agent = agents.find(a => a.id === agentId),
        chat = agent.chats.find(c => c.id === chatId);
  chat.messages.push({ role: "user", content: text });
  document.getElementById("input").value = ""; saveAgents();
  hasReceivedContent = false;

  if (currentAgentId === agentId && currentChatId === chatId) {
    renderMessages();
    const aiMsg = document.createElement("div");
    aiMsg.className = "msg ai";
    aiMsg.style.animation = 'none'; aiMsg.style.opacity = '1'; aiMsg.style.transform = 'none';
    const baseText = '让我想想';
    aiMsg.textContent = baseText;
    aiMsg.dataset.thinkDotCount = "0";
    aiMsg.id = 'streamingMsg';
    document.getElementById("messages").appendChild(aiMsg);
    startThinkingTimer(aiMsg, baseText);
    document.getElementById("messages").scrollTop = document.getElementById("messages").scrollHeight;
  }

  checkText(text).then(async (ok) => {
    if (!ok) {
      chat.messages.pop(); saveAgents();
      if (currentAgentId === agentId && currentChatId === chatId) {
        const aiEl = document.querySelector("#messages #streamingMsg");
        if (aiEl) aiEl.remove();
        stopThinkingTimer();
        const tip = document.createElement("div"); tip.className = "msg ai"; tip.textContent = "换个内容试试吧";
        document.getElementById("messages").appendChild(tip);
      }
      return;
    }
    try {
      const key = getEffectiveApiKey(); if (!key) throw new Error("请先在设置中配置API密钥");
      const model = getEffectiveModel();
      const aiConfig = chat.chatConfig && chat.chatConfig.type ? chat.chatConfig : agent.aiConfig;

      const placeholderMsg = { role: "assistant", content: "", _streaming: true };
      chat.messages.push(placeholderMsg);
      saveAgents();

      const abortController = new AbortController();
      activeStreamAbort = abortController;

      const requestBody = {
        model: model,
        messages: [
          { role: "system", content: buildSystemPrompt(aiConfig) },
          ...chat.messages.filter(m => !m._streaming).map(m => ({ role: m.role, content: m.content }))
        ],
        temperature: aiConfig.temperature || DEFAULT_TEMPERATURE.emotion,
        top_p: 0.9,
        stream: true
      };
      if (config.maxTokens && config.maxTokens > 0) { requestBody.max_tokens = config.maxTokens; }

      const res = await fetch(DEEPSEEK_CONFIG.apiUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + key },
        body: JSON.stringify(requestBody),
        signal: abortController.signal
      });

      const reader = res.body.getReader(); const decoder = new TextDecoder(); let reply = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        const lines = decoder.decode(value, { stream: true }).split('\n');
        for (const line of lines) {
          if (line.startsWith('data: ')) {
            const js = line.slice(6).trim(); if (js === '[DONE]') continue;
            try {
              const delta = JSON.parse(js).choices?.[0]?.delta || {};
              const content = delta.content || '';
              if (content) {
                if (!hasReceivedContent) { stopThinkingTimer(); hasReceivedContent = true; }
                reply += content;
                placeholderMsg.content = reply.replace(/^\n+/, '');
                if (currentAgentId === agentId && currentChatId === chatId) {
                  const aiMsgEl = document.getElementById("streamingMsg");
                  if (aiMsgEl) {
                    aiMsgEl.innerHTML = renderMessageContent(placeholderMsg.content);
                    aiMsgEl.style.animation = 'none'; aiMsgEl.style.opacity = '1'; aiMsgEl.style.transform = 'none';
                  }
                  document.getElementById("messages").scrollTop = document.getElementById("messages").scrollHeight;
                }
              }
            } catch(e) {}
          }
        }
      }

      stopThinkingTimer();
      activeStreamAbort = null;
      delete placeholderMsg._streaming;

      if (!reply) {
        chat.messages.pop();
        reply = agent.aiConfig.type === "emotion" ? "出了差错，请检查网络和API~" : "有点问题，请检查网络和API哦~";
        placeholderMsg.content = reply;
        chat.messages.push({ role: "assistant", content: reply });
      } else {
        reply = reply.replace(/[\u{1F600}-\u{1F6FF}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F1E0}-\u{1F1FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{1F900}-\u{1F9FF}\u{1FA70}-\u{1FAFF}]/gu, '').replace(/[。.]{2,}/g, '').trim();
        placeholderMsg.content = reply;
      }

      if (await checkText(reply)) {
        saveAgents();
        if (currentAgentId === agentId && currentChatId === chatId) {
          const streamingEl = document.getElementById("streamingMsg");
          if (streamingEl) streamingEl.removeAttribute('id');
          renderMessages();
        }
      } else {
        chat.messages = chat.messages.filter(m => m !== placeholderMsg);
        saveAgents();
        if (currentAgentId === agentId && currentChatId === chatId) {
          const streamingEl = document.getElementById("streamingMsg");
          if (streamingEl) streamingEl.remove();
          renderMessages();
          const tip = document.createElement("div"); tip.className = "msg ai"; tip.textContent = "换个内容试试吧";
          document.getElementById("messages").appendChild(tip);
        }
      }
    } catch (e) {
      if (e.name === 'AbortError') return;
      stopThinkingTimer();
      activeStreamAbort = null;
      if (currentAgentId === agentId && currentChatId === chatId) {
        const streamingEl = document.getElementById("streamingMsg");
        if (streamingEl) streamingEl.remove();
        const err = document.createElement("div"); err.className = "msg ai";
        err.textContent = agent.aiConfig.type === "emotion" ? "网断了吧 连不上了" : "请求失败：" + e.message;
        document.getElementById("messages").appendChild(err);
      }
    }
  });
}

let searchTimer = null;
let searchScopeState = JSON.parse(localStorage.getItem('searchScopeState')) || { agentName: true, agentDesc: true, chatTitle: true, message: true };

function saveSearchScopeState() { localStorage.setItem('searchScopeState', JSON.stringify(searchScopeState)); }

function initSearchScopeToggle() {
  const grid = document.getElementById('scopeGrid');
  grid.querySelectorAll('.search-scope-option').forEach(opt => {
    opt.addEventListener('click', function() {
      const scope = this.dataset.scope;
      searchScopeState[scope] = !searchScopeState[scope];
      this.classList.toggle('checked', searchScopeState[scope]);
      saveSearchScopeState();
      const keyword = document.getElementById('searchInput').value;
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => { const results = performSearch(keyword); renderSearchResults(results, keyword); }, 300);
    });
  });
}

function performSearch(keyword) {
  const lowerKeyword = keyword.toLowerCase().trim();
  const results = [];
  if (!lowerKeyword) return results;
  agents.forEach(agent => {
    const agentMatches = [];
    if (searchScopeState.agentName && agent.name.toLowerCase().includes(lowerKeyword)) {
      agentMatches.push({ type: 'agent_field', field: '名称', text: agent.name });
    }
    if (searchScopeState.agentDesc && agent.description && agent.description.toLowerCase().includes(lowerKeyword)) {
      agentMatches.push({ type: 'agent_field', field: '描述', text: agent.description });
    }
    agent.chats.forEach(chat => {
      const chatMatches = [];
      if (searchScopeState.chatTitle && chat.title.toLowerCase().includes(lowerKeyword)) {
        chatMatches.push({ type: 'chat_field', field: '标题', text: chat.title });
      }
      if (searchScopeState.message) {
        chat.messages.forEach((msg, idx) => {
          if (msg.content.toLowerCase().includes(lowerKeyword)) {
            chatMatches.push({ type: 'message', role: msg.role, text: msg.content, msgIndex: idx, preview: msg.content.length > 80 ? msg.content.substring(0, 80) + '...' : msg.content });
          }
        });
      }
      if (chatMatches.length > 0) {
        agentMatches.push({ type: 'chat', chatId: chat.id, chatTitle: chat.title, matches: chatMatches });
      }
    });
    if (agentMatches.length > 0) {
      results.push({ agentId: agent.id, agentName: agent.name, matches: agentMatches });
    }
  });
  return results;
}

function highlightKeyword(text, keyword) {
  if (!keyword.trim()) return text;
  const escaped = keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return text.replace(new RegExp(`(${escaped})`, 'gi'), '<span class="search-highlight">$1</span>');
}

function renderSearchResults(results, keyword) {
  const container = document.getElementById('searchResults');
  if (!keyword.trim()) { container.innerHTML = '<div class="search-empty">输入关键词开始搜索</div>'; return; }
  if (results.length === 0) { container.innerHTML = '<div class="search-empty">未找到匹配结果</div>'; return; }

  let totalCount = 0;
  results.forEach(r => { totalCount += r.matches.length; });
  let html = `<div style="font-size:calc(var(--font-size) - 2px);color:var(--subtext);margin-bottom:12px;padding:0 4px;">共找到 ${totalCount} 条匹配</div>`;

  results.forEach(result => {
    html += '<div class="search-result-group">';
    html += `<div class="search-result-agent" data-agent-id="${result.agentId}">🔍 ${highlightKeyword(result.agentName, keyword)} <span class="count">${result.matches.length} 条</span></div>`;
    result.matches.forEach(match => {
      if (match.type === 'agent_field') {
        html += `<div class="search-result-chat" data-agent-id="${result.agentId}" data-action="enter">${match.field}：${highlightKeyword(match.text, keyword)}</div>`;
      } else if (match.type === 'chat') {
        html += `<div class="search-result-chat" data-agent-id="${result.agentId}" data-chat-id="${match.chatId}" data-action="chat">💬 ${highlightKeyword(match.chatTitle, keyword)}</div>`;
        match.matches.forEach(msgMatch => {
          if (msgMatch.type === 'chat_field') {
            html += `<div class="search-result-message" data-agent-id="${result.agentId}" data-chat-id="${match.chatId}" data-action="chat">${msgMatch.field}：${highlightKeyword(msgMatch.text, keyword)}</div>`;
          } else if (msgMatch.type === 'message') {
            const roleTag = msgMatch.role === 'user' ? '你' : 'AI';
            const roleClass = msgMatch.role === 'user' ? 'user' : 'ai';
            html += `<div class="search-result-message" data-agent-id="${result.agentId}" data-chat-id="${match.chatId}" data-msg-index="${msgMatch.msgIndex}" data-action="message"><span class="role-tag ${roleClass}">${roleTag}</span> ${highlightKeyword(msgMatch.preview, keyword)}</div>`;
          }
        });
      }
    });
    html += '</div>';
  });
  container.innerHTML = html;

  container.querySelectorAll('[data-action="enter"]').forEach(el => {
    el.addEventListener('click', () => { hideModal(document.getElementById('searchModal')); enterChat(el.dataset.agentId); });
  });
  container.querySelectorAll('[data-action="chat"]').forEach(el => {
    el.addEventListener('click', () => {
      hideModal(document.getElementById('searchModal'));
      const agent = agents.find(a => a.id === el.dataset.agentId);
      if (agent) { currentAgentId = el.dataset.agentId; currentChatId = el.dataset.chatId; document.getElementById('chatTitle').innerText = getCurrentChat().title; renderChatList(); renderMessages(); applyChatBackground(); document.getElementById('chatPage').classList.add('show'); }
    });
  });
  container.querySelectorAll('[data-action="message"]').forEach(el => {
    el.addEventListener('click', () => {
      hideModal(document.getElementById('searchModal'));
      const agent = agents.find(a => a.id === el.dataset.agentId);
      if (agent) {
        currentAgentId = el.dataset.agentId; currentChatId = el.dataset.chatId;
        document.getElementById('chatTitle').innerText = getCurrentChat().title;
        renderChatList(); renderMessages(); applyChatBackground();
        document.getElementById('chatPage').classList.add('show');
        setTimeout(() => {
          const msgEls = document.querySelectorAll('#messages .msg');
          const idx = parseInt(el.dataset.msgIndex);
          if (msgEls[idx]) { msgEls[idx].classList.add('highlight'); msgEls[idx].scrollIntoView({ behavior: 'smooth', block: 'center' }); setTimeout(() => msgEls[idx].classList.remove('highlight'), 3000); }
        }, 100);
      }
    });
  });
}

function initSearch() {
  const searchInput = document.getElementById('searchInput');
  function doSearch() { renderSearchResults(performSearch(searchInput.value), searchInput.value); }
  searchInput.addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(doSearch, 300); });
  searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); clearTimeout(searchTimer); doSearch(); } });
  document.getElementById('homeSearchBtn').onclick = () => { showModal(document.getElementById('searchModal')); setTimeout(() => searchInput.focus(), 300); };
  document.getElementById('searchClose').onclick = () => { hideModal(document.getElementById('searchModal')); };
  document.getElementById('searchModal').onclick = (e) => { if (e.target === document.getElementById('searchModal')) hideModal(document.getElementById('searchModal')); };
  initSearchScopeToggle();
}

function initInputFocusScroll() {
  const input = document.getElementById('input');
  const messages = document.getElementById('messages');
  input.addEventListener('focus', function() {
    setTimeout(() => {
      messages.scrollTop = messages.scrollHeight;
      if (!messages.dataset.origPadding) messages.dataset.origPadding = messages.style.paddingBottom || '20px';
      messages.style.paddingBottom = '180px';
    }, 350);
  });
  input.addEventListener('blur', function() { messages.style.paddingBottom = messages.dataset.origPadding || '20px'; });
}

function initImagePreview() {
  const resultImg = document.getElementById('resultImg');
  const previewModal = document.getElementById('previewModal');
  const previewImg = document.getElementById('previewImg');

  previewModal.onclick = function(e) { if (e.target === previewModal) hideModal(previewModal); };

  else { initAll(); setTimeout(() => showNotice(true), 500); }
};

document.addEventListener('DOMContentLoaded', () => { history.pushState(null, null, location.href); window.addEventListener('popstate', () => { window.close(); }); });
</script>
</body>
